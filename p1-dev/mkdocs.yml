site_name: dupfinder
site_description: Detector de archivos duplicados - documentación funcional, técnica y operativa
docs_dir: manual
site_dir: site
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Modo oscuro}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Modo claro}

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Descripción funcional: funcional.md
  - Arquitectura: arquitectura.md
  - Instalación y ejecución: instalacion.md
  - Diseño técnico: diseno.md
  - API y contratos: api.md
  - Pruebas: pruebas.md
  - Rendimiento: rendimiento.md
  - Seguridad: seguridad.md
  - Integración continua: ci.md
  - Mantenimiento: mantenimiento.md
